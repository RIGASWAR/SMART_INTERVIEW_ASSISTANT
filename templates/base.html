<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}InterviewAI{% endblock %}</title>

  <!-- Google Fonts: Syne (display) + DM Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  <style>
    /* ── Flash Messages ─────────────────────────────────────── */
    .flash-container {
      position: fixed; top: 1.2rem; right: 1.2rem;
      z-index: 9999; display: flex; flex-direction: column; gap: .6rem;
    }
    .flash {
      padding: .8rem 1.4rem; border-radius: 10px; font-size: .9rem;
      font-weight: 500; backdrop-filter: blur(12px);
      animation: slideIn .3s ease;
      border: 1px solid rgba(255,255,255,.08);
    }
    .flash.success { background: rgba(34,197,94,.15); color:#4ade80; border-color:#4ade80; }
    .flash.error   { background: rgba(239,68,68,.15);  color:#f87171; border-color:#f87171; }
    .flash.warning { background: rgba(234,179,8,.15);  color:#fbbf24; border-color:#fbbf24; }
    .flash.info    { background: rgba(99,102,241,.15); color:#a5b4fc; border-color:#a5b4fc; }
    @keyframes slideIn {
      from { opacity:0; transform:translateX(30px); }
      to   { opacity:1; transform:translateX(0); }
    }
  </style>
</head>
<body>

  <!-- Flash Messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for cat, msg in messages %}
          <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}

  <script>
    // Auto-dismiss flash messages after 4 s
    setTimeout(() => {
      document.querySelectorAll(".flash").forEach(el => {
        el.style.transition = "opacity .5s";
        el.style.opacity = "0";
        setTimeout(() => el.remove(), 500);
      });
    }, 4000);
  </script>
</body>
</html>

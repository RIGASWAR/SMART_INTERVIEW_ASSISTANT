{% extends "base.html" %}
{% block title %}Login — InterviewAI{% endblock %}

{% block content %}
<div class="auth-wrapper">

  <!-- Animated Background Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="19" stroke="url(#g1)" stroke-width="2"/>
          <path d="M13 20l5 5 9-10" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#7c3aed"/>
              <stop offset="1" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="logo-text">InterviewAI</span>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue your interview prep</p>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-primary btn-full">Sign in</button>
    </form>

    <p class="auth-switch">
      Don't have an account? <a href="{{ url_for('signup') }}">Create one free</a>
    </p>

    <!-- Demo credentials hint -->
    <div class="demo-hint">
      <span>🎯</span>
      <span>New here? Sign up and start practising in under 30 seconds.</span>
    </div>

  </div>
</div>
{% endblock %}
